### Playbook Configuration Variables

## User info
#username:

## zplug info
zplug:
  git_url: https://github.com/zplug/zplug
  install_dir: ~/.zplug

## Task Configuration
setup_zsh: True

## Dotfiles
## Please make sure to update
pull_dotfiles: True
home_dir: "/home/{{ username }}"

dotfiles:
  url: https://github.com/Nka700/.dotfiles.git
  version: debian_on_aws_jpkb
  destination: ~/.dotfiles
  packages:
    - conky
    - fcitx
    - kitty
    - local
    - picom
    - redshift
    - snownews
    - vim
    - vnc
    - xfce4
    - xorg
    - zsh
    - tmux

## Desktop
install_dwm: True

## dwm
pull_suckless: True

suckless:
  url: https://github.com/Nka700/suckless.git
  version: archg83hsdwm

## tlp vars
configure_tlp: True

## nerd_font
nerd_font:
  url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.0.2/JetBrainsMono.zip
