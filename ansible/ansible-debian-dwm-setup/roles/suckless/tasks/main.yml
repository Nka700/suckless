- name: Clone suckless repository
  git:
    repo: "{{ suckless.url }}"
    dest: "{{ home_dir }}"
    version: "{{ suckless.version }}"
    update: no
    force: no
    accept_hostkey: yes

- name: Build and install suckless tools
  command: make clean install
  args:
    chdir: "{{ home_dir }}/suckless/suckless{{ item }}"
  loop:
    - dwm
    - dmenu
    - st
    - slstatus
    - tabbed
  changed_when: false

- name: Deploy dwm.desktop using template
  template:
    src: dwm.desktop.j2
    dest: /usr/share/xsessions/dwm.desktop
    mode: "0644"

- name: Create symlink for dwm
  file:
    src: /usr/local/bin/dwm
    dest: /usr/bin/dwm
    state: link

- name: enable login manager
  systemd:
    name: lightdm.service
    daemon_reload: yes
    enabled: yes
  become: yes

- name: Enable and start xrdp
  service:
    name: xrdp
    state: started
    enabled: yes
